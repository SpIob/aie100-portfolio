    </linearGradient>
    <pattern id="grid-diag" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 0 60 L 60 0 M -20 20 L 20 -20 M 40 80 L 80 40" fill="none" stroke="#1B2A2A" stroke-width="0.5" opacity="0.07"/>
    </pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid-diag)"/>
  <g fill="none" stroke="#2F6F62" stroke-width="2">
    <rect x="200" y="150" width="350" height="250" rx="8"/>
    <rect x="650" y="150" width="350" height="250" rx="8"/>
    <line x1="375" y1="400" x2="825" y2="400" stroke-dasharray="10 5"/>
  </g>
  <g fill="#2F6F62" opacity="0.1">
    <rect x="230" y="180" width="290" height="60" rx="4"/>
    <rect x="230" y="260" width="200" height="40" rx="4"/>
    <rect x="230" y="320" width="250" height="40" rx="4"/>
    <rect x="680" y="180" width="290" height="60" rx="4"/>
    <rect x="680" y="260" width="180" height="40" rx="4"/>
    <rect x="680" y="320" width="220" height="40" rx="4"/>
  </g>
  <g fill="#B4842A">
