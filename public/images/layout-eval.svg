  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#66756F" text-transform="uppercase" letter-spacing="0.08em">
    <text x="375" y="470" text-anchor="middle">LIGHT MODE</text>
    <text x="825" y="470" text-anchor="middle">DARK MODE</text>
  </g>
  <g font-family="Fraunces, serif" fill="#1B2A2A">
    <text x="375" y="130" font-size="20" font-weight="600" text-anchor="middle">Typography</text>
    <text x="825" y="130" font-size="20" font-weight="600" text-anchor="middle">Spacing</text>
