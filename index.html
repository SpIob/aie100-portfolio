    <script>
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("fieldlog-theme"); } catch (e) {}
        var theme =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
